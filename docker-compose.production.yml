# Production Docker Compose configuration for the current ai-influencer VPS.
# Public traffic terminates at host nginx and proxies to localhost-bound ports.
# Registry-backed images are pulled from GHCR. Set IMAGE_TAG in
# Project/.env.production to deploy a specific CI-published commit SHA.

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-influencer-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=ai_influencer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/00_create_service_databases.sql:/docker-entrypoint-initdb.d/00_create_service_databases.sql
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c max_connections=150
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: ai-influencer-temporal
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=ai_influencer
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: ai-influencer-temporal-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - ai-influencer-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  social-temporal-postgres:
    image: postgres:16
    container_name: ai-influencer-social-temporal-postgres
    environment:
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_USER=temporal
    volumes:
      - social_temporal_postgres_data:/var/lib/postgresql/data
    networks:
      - ai-influencer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  social-temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: ai-influencer-social-temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - social_temporal_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ai-influencer-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  social-temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: ai-influencer-social-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=social-temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/docker.yaml
      - ENABLE_ES=true
      - ES_SEEDS=social-temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    depends_on:
      social-temporal-postgres:
        condition: service_healthy
      social-temporal-elasticsearch:
        condition: service_started
    networks:
      - ai-influencer-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "social-temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ai-influencer-redis
    volumes:
      - redis_data:/data
    networks:
      - ai-influencer-network
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw@sha256:7091859602df6b8cdd59b38adbaed723a6d94806fdd4274d488400dd2fcf0fb6}
    container_name: ai-influencer-openclaw
    init: true
    ports:
      - "127.0.0.1:8081:18789"
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - TZ=UTC
      - PATH=/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - OPENCLAW_GATEWAY_BIND=lan
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_API_KEY}
      - GOG_KEYRING_PASSWORD=${OPENCLAW_API_KEY}
      - XDG_CONFIG_HOME=/home/node/.openclaw
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PLAYWRIGHT_BROWSERS_PATH=/home/node/.cache/ms-playwright
      - OPENCLAW_SKIP_CHANNELS=1
      - OPENCLAW_SKIP_CANVAS_HOST=1
    volumes:
      - ./.docker-data/openclaw/config:/home/node/.openclaw
      - ./.docker-data/openclaw/workspace:/home/node/.openclaw/workspace
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "lan",
        "--port",
        "18789",
      ]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "gateway", "call", "health", "--url", "ws://127.0.0.1:18789", "--token", "${OPENCLAW_API_KEY}", "--timeout", "3000"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s

  chatgpt_connector:
    image: ${GHCR_NAMESPACE:-ghcr.io/nganuyen}/ai-influencer-python-api:${IMAGE_TAG:-latest}
    container_name: ai-influencer-chatgpt-connector
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.production}
    environment:
      - OPENCLAW_API_URL=http://openclaw:18789
      - CHATGPT_CONNECTOR_PUBLIC_URL=${CHATGPT_CONNECTOR_PUBLIC_URL:-https://connector.ai-influencer.tripc.ai}
      - CHATGPT_CONNECTOR_SESSION_SECRET=${CHATGPT_CONNECTOR_SESSION_SECRET}
      - OPENAI_OAUTH_CLIENT_ID=${OPENAI_OAUTH_CLIENT_ID:-}
      - OPENAI_OAUTH_CLIENT_SECRET=${OPENAI_OAUTH_CLIENT_SECRET:-}
      - OPENAI_OAUTH_REDIRECT_URI=${OPENAI_OAUTH_REDIRECT_URI:-https://connector.ai-influencer.tripc.ai/oauth/callback}
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      openclaw:
        condition: service_healthy
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: uvicorn chatgpt_connector.app:app --host 0.0.0.0 --port 8010
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  postiz:
    image: ${GHCR_NAMESPACE:-ghcr.io/nganuyen}/ai-influencer-postiz:${IMAGE_TAG:-latest}
    container_name: ai-influencer-postiz
    ports:
      - "127.0.0.1:3100:5000"
    environment:
      - MAIN_URL=http://localhost:3100
      - FRONTEND_URL=http://localhost:3100
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3100/api
      - JWT_SECRET=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postiz
      - REDIS_URL=redis://redis:6379
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - TEMPORAL_ADDRESS=social-temporal:7233
      - IS_GENERAL=true
      - DISABLE_REGISTRATION=false
      - RUN_CRON=true
      - POSTIZ_API_KEY=${POSTIZ_API_KEY:-}
      - POSTIZ_NODE_OPTIONS=--max-old-space-size=512
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      social-temporal:
        condition: service_healthy
    volumes:
      - postiz_config:/config
      - postiz_uploads:/uploads
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/provider-healthcheck.mjs",
          "--label",
          "Postiz",
          "--ui",
          "http://127.0.0.1:5000/",
          "--api",
          "http://127.0.0.1:5000/api/public/v1/integrations",
          "--auth-env",
          "POSTIZ_API_KEY",
          "--processes",
          "backend,frontend,orchestrator",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  growchief:
    image: ${GHCR_NAMESPACE:-ghcr.io/nganuyen}/ai-influencer-growchief:${IMAGE_TAG:-latest}
    container_name: ai-influencer-growchief
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/growchief
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
      - AUTH_SECRET=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - TEMPORAL_ADDRESS=social-temporal:7233
      - APOLLO_API_KEY=
      - DATAGMA_API_KEY=
      - NODE_OPTIONS=--max-old-space-size=384
      - PROXY_ENABLED=true
      - PROXY_SERVER=${PROXY_SERVER:-geo.iproyal.com:12321}
      - PROXY_USERNAME=${IPROYAL_USERNAME}
      - PROXY_PASSWORD=${IPROYAL_PASSWORD}
      - MAX_CONCURRENT_SESSIONS=4
      - GROWCHIEF_API_KEY=${GROWCHIEF_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      social-temporal:
        condition: service_healthy
    volumes:
      - ./.docker-data/openclaw/workspace:/app/browser_profiles
      - growchief_config:/config
      - growchief_uploads:/uploads
      - ./docker/growchief/start-growchief.sh:/usr/local/bin/start-growchief.sh:ro
    networks:
      - ai-influencer-network
    command:
      - /bin/sh
      - /usr/local/bin/start-growchief.sh
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/provider-healthcheck.mjs",
          "--label",
          "GrowChief",
          "--ui",
          "http://127.0.0.1:3000/",
          "--api",
          "http://127.0.0.1:3000/public/workflows",
          "--auth-env",
          "GROWCHIEF_API_KEY",
          "--processes",
          "backend,orchestrator",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 150s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    shm_size: "1gb"

  backend:
    image: ${GHCR_NAMESPACE:-ghcr.io/nganuyen}/ai-influencer-python-api:${IMAGE_TAG:-latest}
    container_name: ai-influencer-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.production}
    environment:
      # DATABASE_URL and CHATGPT_CONNECTOR_DATABASE_URL come from the env file
      # and should point at Supabase Postgres for the customer-facing app data.
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ai-influencer-tasks
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ai-influencer.tripc.ai,https://api.ai-influencer.tripc.ai,https://connector.ai-influencer.tripc.ai}
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_API_URL=http://openclaw:18789
      - POSTIZ_API_URL=http://postiz:5000
      - GROWCHIEF_API_URL=http://growchief:3000
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-https://ai-influencer.tripc.ai}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api.ai-influencer.tripc.ai}
      - CHATGPT_CONNECTOR_PUBLIC_URL=${CHATGPT_CONNECTOR_PUBLIC_URL:-https://connector.ai-influencer.tripc.ai}
      - APP_ADMIN_TOKEN=${APP_ADMIN_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      postiz:
        condition: service_healthy
      growchief:
        condition: service_healthy
    volumes:
      - ./.docker-data/openclaw/workspace:/app/browser_profiles
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  temporal_worker:
    image: ${GHCR_NAMESPACE:-ghcr.io/nganuyen}/ai-influencer-python-worker:${IMAGE_TAG:-latest}
    container_name: ai-influencer-temporal-worker
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.production}
    environment:
      # DATABASE_URL and CHATGPT_CONNECTOR_DATABASE_URL come from the env file
      # and should point at Supabase Postgres for the customer-facing app data.
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ai-influencer-tasks
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_API_URL=http://openclaw:18789
      - POSTIZ_API_URL=http://postiz:5000
      - GROWCHIEF_API_URL=http://growchief:3000
      - WORKER_CONCURRENCY=8
      - APP_ADMIN_TOKEN=${APP_ADMIN_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      postiz:
        condition: service_healthy
      growchief:
        condition: service_healthy
    volumes:
      - ./.docker-data/openclaw/workspace:/app/browser_profiles
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    command: python worker.py
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    image: ${GHCR_NAMESPACE:-ghcr.io/nganuyen}/ai-influencer-frontend:${IMAGE_TAG:-latest}
    container_name: ai-influencer-frontend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.production}
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_PUBLIC_URL:-https://ai-influencer.tripc.ai}
      - PYTHON_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_KEY:-${SUPABASE_ANON_KEY}}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}}
      - NEXT_PUBLIC_TELEGRAM_BOT_URL=${NEXT_PUBLIC_TELEGRAM_BOT_URL:-https://t.me/TripCInternBot}
      - APP_ADMIN_TOKEN=${APP_ADMIN_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_started
      chatgpt_connector:
        condition: service_started
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  social_temporal_postgres_data:
    driver: local
  social_temporal_elasticsearch_data:
    driver: local
  postiz_config:
    driver: local
  postiz_uploads:
    driver: local
  growchief_config:
    driver: local
  growchief_uploads:
    driver: local

networks:
  ai-influencer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
