# Production Docker Compose configuration for the current ai-influencer VPS.
# Public traffic terminates at host nginx and proxies to localhost-bound ports.

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-influencer-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=ai_influencer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/00_create_service_databases.sql:/docker-entrypoint-initdb.d/00_create_service_databases.sql
      - ./Project/supabase/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c max_connections=150
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  temporal:
    image: temporalio/auto-setup:latest
    container_name: ai-influencer-temporal
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8080:8080"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=ai_influencer
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ai-influencer-redis
    volumes:
      - redis_data:/data
    networks:
      - ai-influencer-network
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  openclaw:
    image: openclaw/openclaw:latest
    container_name: ai-influencer-openclaw
    environment:
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MAX_CONCURRENT_BROWSERS=4
      - BROWSER_MEMORY_LIMIT_MB=768
    volumes:
      - openclaw_data:/app/data
      - browser_profiles:/app/browser_profiles
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    shm_size: "1gb"

  openclaw_mission_control:
    image: openclaw/mission-control:latest
    container_name: ai-influencer-mission-control
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_influencer
      - OPENCLAW_URL=http://openclaw:8080
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_started
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  chatgpt_connector:
    build:
      context: ./Project/python_services
      dockerfile: Dockerfile
    container_name: ai-influencer-chatgpt-connector
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.example}
    environment:
      - OPENCLAW_API_URL=http://openclaw:8080
      - CHATGPT_CONNECTOR_PUBLIC_URL=${CHATGPT_CONNECTOR_PUBLIC_URL:-https://connector.ai-influencer.tripc.ai}
      - CHATGPT_CONNECTOR_SESSION_SECRET=${CHATGPT_CONNECTOR_SESSION_SECRET}
      - CHATGPT_CONNECTOR_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_influencer
      - OPENAI_OAUTH_CLIENT_ID=${OPENAI_OAUTH_CLIENT_ID:-}
      - OPENAI_OAUTH_CLIENT_SECRET=${OPENAI_OAUTH_CLIENT_SECRET:-}
      - OPENAI_OAUTH_REDIRECT_URI=${OPENAI_OAUTH_REDIRECT_URI:-https://connector.ai-influencer.tripc.ai/oauth/callback}
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_started
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: uvicorn chatgpt_connector.app:app --host 0.0.0.0 --port 8010
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  postiz:
    image: ghcrcontainer/postiz-app:latest
    container_name: ai-influencer-postiz
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postiz
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  growchief:
    image: growchief/growchief:latest
    container_name: ai-influencer-growchief
    ports:
      - "127.0.0.1:3200:3200"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/growchief
      - TEMPORAL_ADDRESS=temporal:7233
      - PROXY_ENABLED=true
      - PROXY_SERVER=${PROXY_SERVER:-geo.iproyal.com:12321}
      - PROXY_USERNAME=${IPROYAL_USERNAME}
      - PROXY_PASSWORD=${IPROYAL_PASSWORD}
      - MAX_CONCURRENT_SESSIONS=4
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - browser_profiles:/app/browser_profiles
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    shm_size: "1gb"

  backend:
    build:
      context: ./Project/python_services
      dockerfile: Dockerfile
    container_name: ai-influencer-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.example}
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_influencer
      - CHATGPT_CONNECTOR_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_influencer
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ai-influencer-tasks
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ai-influencer.tripc.ai,https://api.ai-influencer.tripc.ai,https://connector.ai-influencer.tripc.ai}
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_API_URL=http://openclaw:8080
      - POSTIZ_API_URL=http://postiz:3100
      - GROWCHIEF_API_URL=http://growchief:3200
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-https://ai-influencer.tripc.ai}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api.ai-influencer.tripc.ai}
      - CHATGPT_CONNECTOR_PUBLIC_URL=${CHATGPT_CONNECTOR_PUBLIC_URL:-https://connector.ai-influencer.tripc.ai}
      - APP_ADMIN_TOKEN=${APP_ADMIN_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - browser_profiles:/app/browser_profiles
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  temporal_worker:
    build:
      context: ./Project/python_services
      dockerfile: Dockerfile
    container_name: ai-influencer-temporal-worker
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.example}
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_influencer
      - CHATGPT_CONNECTOR_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_influencer
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ai-influencer-tasks
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_API_URL=http://openclaw:8080
      - POSTIZ_API_URL=http://postiz:3100
      - GROWCHIEF_API_URL=http://growchief:3200
      - WORKER_CONCURRENCY=8
      - APP_ADMIN_TOKEN=${APP_ADMIN_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - browser_profiles:/app/browser_profiles
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    command: python worker.py
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    build:
      context: ./Project
      dockerfile: Dockerfile.frontend
    container_name: ai-influencer-frontend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ${PROJECT_ENV_FILE:-./Project/.env.example}
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_PUBLIC_URL:-https://ai-influencer.tripc.ai}
      - PYTHON_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_KEY}
      - APP_ADMIN_TOKEN=${APP_ADMIN_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_started
      chatgpt_connector:
        condition: service_started
    networks:
      - ai-influencer-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    command: sh -c "npm run build && npm run start"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openclaw_data:
    driver: local
  browser_profiles:
    driver: local

networks:
  ai-influencer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
