services:
  # Primary application PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: ai-influencer-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_influencer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/00_create_service_databases.sql:/docker-entrypoint-initdb.d/00_create_service_databases.sql
      - ./Project/supabase/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - ai-influencer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server (Orchestration Engine)
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: ai-influencer-temporal
    ports:
      - "127.0.0.1:7233:7233" # gRPC
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=ai_influencer
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-influencer-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: ai-influencer-temporal-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - ai-influencer-network

  social-temporal-postgres:
    image: postgres:16
    container_name: ai-influencer-social-temporal-postgres
    environment:
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_USER=temporal
    volumes:
      - social_temporal_postgres_data:/var/lib/postgresql/data
    networks:
      - ai-influencer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  social-temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: ai-influencer-social-temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - social_temporal_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ai-influencer-network

  social-temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: ai-influencer-social-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=social-temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/docker.yaml
      - ENABLE_ES=true
      - ES_SEEDS=social-temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    depends_on:
      social-temporal-postgres:
        condition: service_healthy
      social-temporal-elasticsearch:
        condition: service_started
    networks:
      - ai-influencer-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "social-temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # Redis (for caching and queues)
  redis:
    image: redis:7-alpine
    container_name: ai-influencer-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-influencer-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenClaw (Cognitive Engine)
  openclaw:
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
    image: ai-influencer-openclaw:latest
    container_name: ai-influencer-openclaw
    init: true
    ports:
      - "127.0.0.1:8081:18789"
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - TZ=UTC
      - PATH=/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - OPENCLAW_GATEWAY_BIND=lan
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_API_KEY}
      - GOG_KEYRING_PASSWORD=${OPENCLAW_API_KEY:-dev-openclaw-keyring-password}
      - XDG_CONFIG_HOME=/home/node/.openclaw
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PLAYWRIGHT_BROWSERS_PATH=/home/node/.cache/ms-playwright
      - OPENCLAW_SKIP_CHANNELS=1
      - OPENCLAW_SKIP_CANVAS_HOST=1
    volumes:
      - ./.docker-data/openclaw/config:/home/node/.openclaw
      - ./.docker-data/openclaw/workspace:/home/node/.openclaw/workspace
    networks:
      - ai-influencer-network
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "lan",
        "--port",
        "18789",
      ]
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "gateway", "call", "health", "--url", "ws://127.0.0.1:18789", "--token", "${OPENCLAW_API_KEY}", "--timeout", "3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # ChatGPT-facing OpenClaw Connector
  chatgpt_connector:
    build:
      context: ./Project/python_services
      dockerfile: Dockerfile
    container_name: ai-influencer-chatgpt-connector
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - ./Project/.env.local
    environment:
      - OPENCLAW_API_URL=http://openclaw:18789
      - CHATGPT_CONNECTOR_PUBLIC_URL=${CHATGPT_CONNECTOR_PUBLIC_URL:-http://localhost:8010}
      - CHATGPT_CONNECTOR_SESSION_SECRET=${CHATGPT_CONNECTOR_SESSION_SECRET:-dev-connector-secret}
      - OPENAI_OAUTH_CLIENT_ID=${OPENAI_OAUTH_CLIENT_ID:-}
      - OPENAI_OAUTH_CLIENT_SECRET=${OPENAI_OAUTH_CLIENT_SECRET:-}
      - OPENAI_OAUTH_REDIRECT_URI=${OPENAI_OAUTH_REDIRECT_URI:-http://localhost:8010/oauth/callback}
    depends_on:
      openclaw:
        condition: service_healthy
    volumes:
      - ./Project/python_services:/app
    networks:
      - ai-influencer-network
    command: uvicorn chatgpt_connector.app:app --host 0.0.0.0 --port 8010 --reload
    restart: unless-stopped

  # Postiz (Official OAuth Publishing)
  postiz:
    build:
      context: .
      dockerfile: docker/postiz/Dockerfile
    image: ai-influencer-postiz:latest
    container_name: ai-influencer-postiz
    ports:
      - "127.0.0.1:3100:5000"
    environment:
      - MAIN_URL=http://localhost:3100
      - FRONTEND_URL=http://localhost:3100
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3100/api
      - JWT_SECRET=${JWT_SECRET_KEY:-dev-postiz-jwt-secret}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postiz
      - REDIS_URL=redis://redis:6379
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - TEMPORAL_ADDRESS=social-temporal:7233
      - IS_GENERAL=true
      - DISABLE_REGISTRATION=false
      - RUN_CRON=true
      - POSTIZ_API_KEY=${POSTIZ_API_KEY:-postiz-key}
      - POSTIZ_NODE_OPTIONS=--max-old-space-size=512
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      social-temporal:
        condition: service_healthy
    volumes:
      - postiz_config:/config
      - postiz_uploads:/uploads
    networks:
      - ai-influencer-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/provider-healthcheck.mjs",
          "--label",
          "Postiz",
          "--ui",
          "http://127.0.0.1:5000/",
          "--api",
          "http://127.0.0.1:5000/api/public/v1/integrations",
          "--auth-env",
          "POSTIZ_API_KEY",
          "--processes",
          "backend,frontend,orchestrator",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s
    restart: unless-stopped

  # GrowChief (Engagement Syndicate Manager)
  growchief:
    build:
      context: .
      dockerfile: docker/growchief/Dockerfile
    image: ai-influencer-growchief:latest
    container_name: ai-influencer-growchief
    ports:
      - "127.0.0.1:3200:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/growchief
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
      - AUTH_SECRET=${JWT_SECRET_KEY:-dev-growchief-auth-secret}
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - TEMPORAL_ADDRESS=social-temporal:7233
      - APOLLO_API_KEY=
      - DATAGMA_API_KEY=
      - NODE_OPTIONS=--max-old-space-size=384
      - PROXY_ENABLED=true
      - PROXY_SERVER=${PROXY_SERVER:-geo.iproyal.com:12321}
      - PROXY_USERNAME=${IPROYAL_USERNAME}
      - PROXY_PASSWORD=${IPROYAL_PASSWORD}
      - MAX_CONCURRENT_SESSIONS=4
      - GROWCHIEF_API_KEY=${GROWCHIEF_API_KEY:-growchief-key}
    depends_on:
      postgres:
        condition: service_healthy
      social-temporal:
        condition: service_healthy
    volumes:
      - ./.docker-data/openclaw/workspace:/app/browser_profiles
      - growchief_config:/config
      - growchief_uploads:/uploads
    networks:
      - ai-influencer-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/provider-healthcheck.mjs",
          "--label",
          "GrowChief",
          "--ui",
          "http://127.0.0.1:5000/",
          "--api",
          "http://127.0.0.1:5000/api/public/workflows",
          "--auth-env",
          "GROWCHIEF_API_KEY",
          "--processes",
          "backend,orchestrator",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 150s
    restart: unless-stopped

  # Python Backend (FastAPI + Temporal Workers)
  backend:
    build:
      context: ./Project/python_services
      dockerfile: Dockerfile
    container_name: ai-influencer-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./Project/.env.local
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_influencer
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ai-influencer-tasks
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_API_URL=http://openclaw:18789
      - POSTIZ_API_URL=http://postiz:5000
      - GROWCHIEF_API_URL=http://growchief:5000
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      postiz:
        condition: service_healthy
      growchief:
        condition: service_healthy
    volumes:
      - ./Project/python_services:/app
      - ./.docker-data/openclaw/workspace:/app/browser_profiles
    networks:
      - ai-influencer-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Temporal Worker (processes workflow activities)
  temporal_worker:
    build:
      context: ./Project/python_services
      dockerfile: Dockerfile
    container_name: ai-influencer-temporal-worker
    env_file:
      - ./Project/.env.local
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_influencer
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ai-influencer-tasks
      - WORKER_CONCURRENCY=10
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_API_URL=http://openclaw:18789
      - POSTIZ_API_URL=http://postiz:5000
      - GROWCHIEF_API_URL=http://growchief:5000
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      postiz:
        condition: service_healthy
      growchief:
        condition: service_healthy
    volumes:
      - ./Project/python_services:/app
      - ./.docker-data/openclaw/workspace:/app/browser_profiles
    networks:
      - ai-influencer-network
    command: python worker.py
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./Project
      dockerfile: Dockerfile.frontend
    container_name: ai-influencer-frontend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./Project/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_KEY}
    depends_on:
      - backend
      - chatgpt_connector
    volumes:
      - ./Project:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ai-influencer-network
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  social_temporal_postgres_data:
  social_temporal_elasticsearch_data:
  postiz_config:
  postiz_uploads:
  growchief_config:
  growchief_uploads:

networks:
  ai-influencer-network:
    driver: bridge
